# Настройки пайплайна нарезки и публикации

whisper:
  model: medium        # tiny/base/small/medium/large-v3 — больше = точнее и медленнее
  language: ru
  device: cuda         # RTX/NVIDIA: cuda; при ошибке программа безопасно вернётся на CPU
  compute_type: auto   # auto = float16 на CUDA, int8 на CPU
  cuda_fallback: true

highlight:
  provider: ollama
  ollama_host: http://localhost:11434
  model: qwen2.5:7b     # если ПК слабый — замените на qwen2.5:3b
  context_tokens: 16384 # окно контекста Ollama
  min_segment_seconds: 20
  max_segment_seconds: 59
  max_segments_per_video: 5

render:
  output_width: 1080
  output_height: 1920
  video_encoder: auto   # auto: NVENC -> QSV -> AMF -> libx264
  hardware_quality: 22
  hardware_preset: p4
  software_crf: 21
  software_preset: veryfast
  font: Arial
  font_size: 64
  highlight_color: '&H0000D7FF'  # ASS BGR: жёлтый — текущее слово
  base_color: '&H00FFFFFF'       # белый — обычный текст

audio_processing:
  voice_isolation:
    enabled: true
    python_path: audio-venv/Scripts/python.exe
    model: htdemucs
    device: cuda
    segment_seconds: 7       # безопасно для RTX 3060 6 ГБ
    overlap: 0.25
    shifts: 1
    cpu_fallback: true
    timeout_seconds: 3600
  loudness:
    background_lufs: -24.0   # EBU R128 bed до ducking
    voice_lufs: -16.0
    final_lufs: -14.0
    true_peak_db: -1.5
    codec_headroom_db: 2.1  # запас лимитера под inter-sample peak после AAC
    lra: 11.0
    voice_lra: 7.0
  ducking:
    threshold: 0.035
    ratio: 8.0
    attack_ms: 18.0
    release_ms: 280.0

subtitles:
  min_cps: 12.0
  max_cps: 17.0
  max_cpl: 42
  max_lines: 2
  min_duration: 0.9
  max_duration: 6.0
  gap_seconds: 0.033333
  frame_rate: 30.0
  scene_threshold: 0.32
  scene_snap_seconds: 0.16
  max_word_gap: 0.75

publishing:
  telegram:
    enabled: false                    # включить после заполнения TELEGRAM_* в .env
    post_times: ['10:00', '19:00']   # локальное время
  youtube:
    enabled: false                    # включать после OAuth и приватной тестовой загрузки
    post_times: ['12:00']
    privacy_status: private           # private | unlisted | public
    category_id: '24'                 # Entertainment
    notify_subscribers: false
    client_secrets_path: oauth/client_secrets.json
    token_path: oauth/youtube_token.json

dorama:
  search_query: 'китайские дорамы 2026'
  search_results: 10
  search_sources: [youtube, bilibili, dailymotion, internet_archive, wikimedia_commons]
  voice_preset: tiktok_story
  voice: 'ru-RU-DmitryNeural'
  rate: '+12%'
  pitch: '-2Hz'
  tts_provider: edge
  chatterbox_device: cuda
  chatterbox_voice_reference: ''  # WAV 10–15 секунд с разрешённым голосом
  chatterbox_cfg_weight: 0.0
  chatterbox_exaggeration: 0.35
  chatterbox_temperature: 0.55
  tts_fallback_to_edge: true
  tts_qa_enabled: true
  tts_qa_min_similarity: 0.88
  target_duration_seconds: 300
  target_script_words: 680
  base_hashtags: ['#китайскиедорамы', '#дорамы', '#cdrama', '#чтопосмотреть']
  require_review: true  # true блокирует автопубликацию планировщиком

episode:
  target_duration_seconds: 300
  target_narration_words: 680
  scene_count: 9
  source_language: auto
  require_rights_confirmation: true

licensed_sources:
  youtube_search_results: 10
  search_sources: [youtube, wikimedia_commons, internet_archive]
  download_height: 720
  max_download_mb: 700
  require_creative_commons: true
  # Канал можно добавить только при наличии отдельного письменного разрешения.
  # Формат: "UC_CHANNEL_ID": "номер договора или ссылка на разрешение"
  approved_channels: {}

web:
  max_upload_mb: 2048  # жёсткий лимит одной локальной загрузки

paths:
  input_dir: input
  pending_dir: output/pending
  posted_dir: output/posted
  rejected_dir: output/rejected
  db_path: storage/queue.db
  cache_dir: storage/cache
